---
- name: Download MinIO Server Binary
  get_url:
    url: [https://dl.min.io/server/minio/release/linux-amd64/minio](https://dl.min.io/server/minio/release/linux-amd64/minio)
    dest: /usr/local/bin/minio
    mode: '0755'

- name: Create MinIO Service Group
  group:
    name: minio-user
    state: present

- name: Create MinIO Service User
  user:
    name: minio-user
    group: minio-user
    shell: /sbin/nologin

- name: Create MinIO Storage Directory
  file:
    path: /mnt/minio_data
    state: directory
    owner: minio-user
    group: minio-user
    mode: '0750'

- name: Create MinIO Environment Config File
  copy:
    dest: /etc/default/minio
    content: |
      MINIO_VOLUMES="/mnt/minio_data"
      MINIO_OPTS="--console-address :9001"
      MINIO_ROOT_USER="minioadmin"
      MINIO_ROOT_PASSWORD="MinioSuperSecurePass2026!"

- name: Open Firewall Ports for MinIO
  ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - '9000' # API Port
    - '9001' # Console Port